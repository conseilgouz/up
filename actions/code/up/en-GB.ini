; ----- DOCUMENTATION
shortdesc="Display source code without executing it, in a framed block with a copy button"
longdesc="Syntax: {up code}...code to display...{/up code}<br>The content is displayed as text and can be copied without presentation markup. Embedded tags and shortcodes are not interpreted by the browser."

code="Code to display (when no content is provided between the tags)"
title="Optional title displayed above the code"
lang="Language or code type (visual hint)"
copy="Show the copy button (1=yes, 0=no)"
background="Block background color"
color="Text color"

normalize="Normalize line breaks and formatting tags added by a WYSIWYG editor (1=yes, 0=no)"
