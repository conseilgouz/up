<!DOCTYPE html>
<html>
<head>
<title>code - editor button</title>
<meta charset = "UTF-8">
<meta name = "viewport" content = "width=device-width, initial-scale=1.0">
</head>
<body>
<p class="upbtn-demo"><a href="https://up.lomart.fr/demo/action-code" target="_blank">See the demo site</a></p>
<div class="upbtn-doc">
<p>Display source code without executing it, in a framed block with a copy button</p>
<p>Syntax: <code><b>{</b>up code<b>}</b></code>...code to display...<code><b>{</b>/up code<b>}</b></code><br>The content is displayed as text and can be copied without presentation markup. Embedded tags and shortcodes are not interpreted by the browser.</p>
</div >
<p><label for="code" title="Code to display (when no content is provided between the tags)">code</label>
<input type = "text" id="code" placeholder=""></p>
<p><label for="title" title="Optional title displayed above the code">title</label>
<input type = "text" name="title" placeholder=""></p>
<p><label for="lang" title="Language or code type (visual hint)">lang</label>
<input type = "text" name="lang" placeholder=""></p>
<p><label for="copy" title="Show the copy button (1=yes, 0=no)">copy</label>
<input type = "text" name="copy" placeholder="1"></p>
<p><label for="normalize" title="Normalize line breaks and formatting tags added by a WYSIWYG editor (1=yes, 0=no)">normalize</label>
<input type = "text" name="normalize" placeholder="1"></p>
<p><label for="background" title="Block background color">background</label>
<input type = "text" name="background" placeholder="#eeeeee"></p>
<p><label for="color" title="Text color">color</label>
<input type = "text" name="color" placeholder="#333333"></p>
<p><label for="style" title="style associ&eacute; &agrave; l&#039;action">style</label>
<input type = "text" name="style" placeholder=""></p>
<p><label for="class" title="classe associ&eacute;e &agrave; l&#039;action">class</label>
<input type = "text" name="class" placeholder=""></p>
</body>
</html >
